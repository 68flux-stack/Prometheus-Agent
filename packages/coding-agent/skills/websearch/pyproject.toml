[project]
name = "prometheus-skill-websearch"
version = "0.1.0"
description = "Web search skill for Prometheus (Exa's remote MCP server)."
requires-python = ">=3.10"
dependencies = ["mcp", "httpx>=0.27,<1", "prometheus-runtime"]

[project.scripts]
websearch = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/websearch"]
