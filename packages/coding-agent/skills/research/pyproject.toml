[project]
name = "prometheus-skill-research"
version = "0.1.0"
description = "Deep research ledger for Prometheus: evidence notes, coverage, gaps, and a citation-verified report."
requires-python = ">=3.10"
dependencies = ["prometheus-runtime"]

[project.scripts]
research = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research"]
